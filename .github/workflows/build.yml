name: Verify production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install from the public npm registry
        run: npm ci --registry=https://registry.npmjs.org/ --replace-registry-host=never
      - run: npm run lint
      - run: npm run build
